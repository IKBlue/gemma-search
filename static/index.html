<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>素材库语义检索 · EmbeddingGemma 2</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e6e9ef; --dim:#98a2b3; --accent:#5b8cff; --accent2:#34d399;
    --warn:#fbbf24; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 18px}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap}
  h1 span{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
  .stats{color:var(--dim);font-size:12px;margin-left:auto;white-space:nowrap}
  .bar{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
  input[type=text]{flex:1;min-width:240px;background:var(--panel);border:1px solid var(--line);
       color:var(--fg);padding:11px 14px;border-radius:var(--radius);font-size:14px;outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:0;padding:11px 18px;border-radius:var(--radius);
         font-size:14px;cursor:pointer;font-weight:500}
  button:hover{filter:brightness(1.1)}
  button.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
  #drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:8px 14px;
        color:var(--dim);cursor:pointer;font-size:13px;transition:.15s;white-space:nowrap}
  #drop.hot{border-color:var(--accent2);color:var(--accent2);background:rgba(52,211,153,.06)}
  .chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);
        padding:5px 13px;border-radius:999px;font-size:12.5px;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  main{padding:18px}
  #meta{color:var(--dim);font-size:12.5px;margin-bottom:12px;min-height:18px}
  #meta b{color:var(--fg);font-weight:600}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        overflow:hidden;cursor:pointer;transition:.15s;position:relative}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .thumb{aspect-ratio:4/3;background:var(--panel2);display:block;width:100%;object-fit:cover}
  .cbody{padding:8px 10px 10px}
  .cname{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
  .crow{display:flex;align-items:center;gap:6px;margin-top:5px}
  .badge{font-size:10.5px;padding:1.5px 7px;border-radius:999px;background:var(--panel2);
         color:var(--dim);border:1px solid var(--line)}
  .badge.VR{color:#93c5fd;border-color:#1e3a8a} .badge.CR{color:#86efac;border-color:#14532d}
  .badge.CR\+VR{color:#fcd34d;border-color:#78350f} .badge\.其他{color:#cbd5e1}
  .score{margin-left:auto;font-size:11.5px;color:var(--accent2);font-variant-numeric:tabular-nums}
  .sbar{height:3px;background:var(--panel2);border-radius:2px;margin-top:6px;overflow:hidden}
  .sbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  #empty{color:var(--dim);text-align:center;padding:60px 20px}
  #empty code{background:var(--panel);padding:2px 6px;border-radius:4px;color:var(--fg)}
  aside{position:fixed;top:0;right:0;width:min(420px,92vw);height:100%;background:var(--panel);
        border-left:1px solid var(--line);transform:translateX(102%);transition:.22s;z-index:40;
        display:flex;flex-direction:column}
  aside.on{transform:none;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
  .ahead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .ahead b{font-size:14px} .ahead button{margin-left:auto;padding:6px 12px;font-size:13px}
  .abody{padding:16px;overflow:auto}
  .abody img{width:100%;border-radius:10px;background:var(--panel2)}
  .kv{display:grid;grid-template-columns:88px 1fr;gap:8px 12px;margin-top:14px;font-size:13px}
  .kv dt{color:var(--dim)} .kv dd{margin:0;word-break:break-all}
  .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
         background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:10px 18px;
         border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:60;font-size:13px}
  #toast.on{opacity:1;transform:translateX(-50%)}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);
        border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .mono{font-family:Consolas,monospace;font-size:12px;color:var(--dim)}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>素材库语义检索<span>EmbeddingGemma 2 · 768 维统一空间</span></h1>
    <div class="stats" id="stats">载入中…</div>
  </div>

  <div class="bar">
    <input type="text" id="q" placeholder="用一句话描述你要找的东西，例如：现代简约布艺沙发 客厅 茶几">
    <button id="go">搜索</button>
    <div id="drop">🖼 拖一张图进来 / 点击上传</div>
    <input type="file" id="file" accept="image/*" hidden>
    <button class="ghost" id="clear">清空</button>
  </div>

  <div class="chips" id="chips"></div>
</header>

<main>
  <div id="meta"></div>
  <div id="grid"></div>
  <div id="empty">
    输入文字或拖入一张图片开始检索。<br><br>
    索引未建立时请先运行 <code>python build_index.py</code>。
  </div>
</main>

<aside id="panel">
  <div class="ahead">
    <b>详情</b>
    <button class="ghost" id="pclose">关闭</button>
  </div>
  <div class="abody" id="pbody"></div>
</aside>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let FOLDER = "全部";
let LAST = [];

/* ---------- 初始化 ---------- */
async function boot(){
  try{
    const s = await (await fetch("/api/stats")).json();
    if (s.load_error){
      $("#stats").innerHTML = '<span style="color:var(--warn)">索引未建立</span>';
      $("#empty").innerHTML = '索引尚未建立：<code>python build_index.py</code><br><br>' + s.load_error;
      return;
    }
    const enc = (s.encoded !== undefined) ? s.encoded : s.indexed;
    const done = enc >= s.indexed;
    $("#stats").innerHTML =
      `${s.indexed} 张 · ${s.dim} 维 · 配对模型包 ${s.paired} · 建于 ${s.built_at||"?"}` +
      (done ? "" :
        ` · <span style="color:var(--warn)">索引构建中 ${enc}/${s.indexed}（${s.progress_pct}%），仅已完成部分可被检索</span>`);
    const folders = ["全部", ...Object.keys(s.folders||{})];
    $("#chips").innerHTML = folders.map(f =>
      `<div class="chip${f===FOLDER?" on":""}" data-f="${f}">${f}${f!=="全部"?" ("+s.folders[f]+")":""}</div>`
    ).join("");
    $("#chips").onclick = e => {
      const c = e.target.closest(".chip"); if(!c) return;
      FOLDER = c.dataset.f;
      [...document.querySelectorAll(".chip")].forEach(x=>x.classList.toggle("on", x===c));
      if (LAST.length) render(LAST);           // 已有结果就地重筛（服务端已按 folder 过滤，这里仅重问）
      if ($("#q").value.trim()) searchText();
    };
  }catch(e){ $("#stats").textContent = "无法连接服务：" + e; }
}

/* ---------- 检索 ---------- */
function busy(on, txt){
  $("#go").innerHTML = on ? '<span class="spin"></span> 检索中' : "搜索";
  $("#meta").textContent = txt || "";
}

async function searchText(){
  const q = $("#q").value.trim();
  if(!q) return;
  busy(true, "正在编码查询…");
  const t0 = performance.now();
  try{
    const url = `/api/search?q=${encodeURIComponent(q)}&k=60&folder=${encodeURIComponent(FOLDER)}`;
    const r = await (await fetch(url)).json();
    if (r.error) throw new Error(r.error);
    LAST = r.results;
    render(LAST);
    $("#meta").innerHTML = `「<b>${q}</b>」 命中 <b>${r.count}</b> 条 · 服务端 ${r.elapsed_ms}ms · 端到端 ${Math.round(performance.now()-t0)}ms`;
  }catch(e){ $("#meta").textContent = "检索失败：" + e.message; }
  finally{ busy(false); }
}

async function searchImage(file){
  busy(true, "正在编码图片…");
  const t0 = performance.now();
  try{
    const r = await (await fetch(`/api/search_image?k=60&folder=${encodeURIComponent(FOLDER)}`,
                                 {method:"POST", body:file})).json();
    if (r.error) throw new Error(r.error);
    LAST = r.results;
    render(LAST);
    $("#meta").innerHTML = `以图搜图（${file.name}） 命中 <b>${r.count}</b> 条 · 服务端 ${r.elapsed_ms}ms · 端到端 ${Math.round(performance.now()-t0)}ms`;
  }catch(e){ $("#meta").textContent = "检索失败：" + e.message; }
  finally{ busy(false); }
}

/* ---------- 渲染 ---------- */
function render(list){
  const g = $("#grid");
  $("#empty").style.display = list.length ? "none" : "block";
  g.innerHTML = list.map(it => {
    const pct = Math.max(0, Math.min(1, it.score)) * 100;
    const cls = it.folder.replace("+","\\+");
    return `<div class="card" data-id="${it.id}">
      <img class="thumb" loading="lazy" src="${it.thumb}" alt="">
      <div class="cbody">
        <div class="cname" title="${it.rel_path}">${it.name}</div>
        <div class="crow">
          <span class="badge ${cls}">${it.folder}</span>
          ${it.archive ? '<span class="badge">有模型包</span>' : '<span class="badge">无包</span>'}
          <span class="score">${it.score.toFixed(3)}</span>
        </div>
        <div class="sbar"><i style="width:${pct}%"></i></div>
      </div>
    </div>`;
  }).join("");
  g.onclick = e => {
    const c = e.target.closest(".card"); if(c) openDetail(c.dataset.id);
  };
}

/* ---------- 详情 ---------- */
async function openDetail(id){
  try{
    const it = await (await fetch("/api/item?id="+id)).json();
    if (it.error) throw new Error(it.error);
    $("#pbody").innerHTML = `
      <img src="/api/thumb?id=${it.id}" alt="">
      <dl class="kv">
        <dt>文件名</dt><dd>${it.name}</dd>
        <dt>分类</dt><dd>${it.folder}</dd>
        <dt>相对路径</dt><dd class="mono">${it.rel_path}</dd>
        <dt>模型包</dt><dd class="mono">${it.archive || "（无同名包）"}</dd>
        <dt>包在磁盘</dt><dd>${it.archive_exists ? "✓ 存在" : "✗ 未找到"}</dd>
        <dt>大小</dt><dd>${(it.size/1024).toFixed(1)} KB</dd>
      </dl>
      <div class="acts">
        <button id="bopen" ${it.archive_exists||it.archive?"":"disabled"}>在资源管理器中定位</button>
        <button class="ghost" id="bcopy">复制路径</button>
      </div>`;
    $("#panel").classList.add("on");
    $("#bopen").onclick = async () => {
      const r = await (await fetch("/api/open?id="+id, {method:"POST"})).json();
      toast(r.error ? r.error : "已在资源管理器中定位");
    };
    $("#bcopy").onclick = () => {
      navigator.clipboard.writeText(it.archive_path || it.abs_path)
        .then(()=>toast("路径已复制")).catch(()=>toast("复制失败"));
    };
  }catch(e){ toast("详情加载失败：" + e.message); }
}

let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("on"), 2200);
}

/* ---------- 事件 ---------- */
$("#go").onclick = searchText;
$("#q").onkeydown = e => { if(e.key==="Enter") searchText(); };
$("#clear").onclick = () => {
  $("#q").value = ""; LAST = []; $("#grid").innerHTML = "";
  $("#meta").textContent = ""; $("#empty").style.display = "block";
};
$("#pclose").onclick = () => $("#panel").classList.remove("on");
document.addEventListener("keydown", e => { if(e.key==="Escape") $("#panel").classList.remove("on"); });

const drop = $("#drop"), file = $("#file");
drop.onclick = () => file.click();
file.onchange = () => { if(file.files[0]) searchImage(file.files[0]); };
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add("hot");
}));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove("hot");
}));
drop.addEventListener("drop", e => {
  const f = e.dataTransfer.files[0]; if(f) searchImage(f);
});
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());

boot();
</script>
</body>
</html>
