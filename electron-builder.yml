# electron-builder.yml —— 打包配置（**P6 才真正使用**；现在只保证形状正确、不被误用）
#
# 现状（2026-10-10 迁移时如实记录，2026-10-12 monorepo 化后更新路径）：
#   · 图标是 electron-vite 脚手架的**默认图标**，不是本项目的 —— P6 换真图标
#   · `asarUnpack` 只列了 resources；`onnxruntime-node` / `sharp` 的原生 `.node`
#     在 asar 里加载不了，P6 必须按实测把它们加进 asarUnpack（**别照抄，要实测**）
#   · 模型（fp32 1.63 GB）与索引**不进安装器**（SPEC-app §3：NSIS 约 2 GB 封顶）
#   · ⚠️ **从未真正打包过**：下面的 files 排除清单只保证与新布局（apps/ + packages/）
#     形状一致，不代表打包已验证；P6 必须以实测为准。
appId: com.gemmasearch.app
productName: gemma-search
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  # 源码不随包发布：主进程与 preload 已被 electron-vite 打进 out/（引擎、索引兼容层、
  # 令牌一并进 bundle 或产物），渲染层也在 out/renderer。旧布局的 '!src/*' · '!core/*' ·
  # '!onnx-spike/*' 三条，对应现在的 apps/ 与 packages/ 两条。
  - '!apps/*'
  - '!packages/*'
  # 正文文档 / 工具 / 测试 / 启动辅助 / 本机数据与证据，都不进安装器。
  # （旧清单里的 static · spike · archive 现已归入 docs/archive/，由 docs/ 一条覆盖。）
  - '!docs/*'
  - '!tools/*'
  - '!tests/*'
  - '!scripts/*'
  - '!data/*'
  - '!reports/*'
  - '!reference/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc,package-lock.json}'
  # ⚠️ 下面三条是 **T-22a 实测（2026-10-15）后补的**：原本缺失，导致未打包产物 asar = 3,685,390,481 B：
  #   · model-cache/ 3160.5 MB —— 上面那条注释写着"模型（fp32 1.63 GB）与索引不进安装器"，
  #     但**清单从来没排过它** ⇒ 那句话只是注释，不是事实；照原样打 NSIS 会远超 SPEC-app §3 的 ~2 GB 上限。
  #   · .npm-cache/ 177.5 MB（本机 npm 缓存）· tsconfig.*.tsbuildinfo（构建中间物）。
  #   实测依据：reports/2026-10-15-wave3/22a.txt（asar 顶层体积表）。
  - '!model-cache/*'
  - '!.npm-cache/*'
  - '!*.tsbuildinfo'
  # ⚠️ 下面三条是 **T-22d 实测（2026-10-15）后补的**，依据 reports/2026-10-15-wave3/22c.txt 的审计
  #    （T-22c 查清了"哪些能裁、哪些不能动"）。两条排除各自带一个**前提**；
  #    **前提一旦不成立，排除必须撤销** —— 这两种情况失败的样子是"功能直接不可用"，不是"变慢"。
  #
  #   【前提 A】编码只在**主进程** ⇒ 排除 onnxruntime-web（本机实测 138.7 MB，躺在 asar 内）
  #     为什么：transformers 在 Node/Electron 主进程这条路上**只会要 onnxruntime-node**；
  #     22c 实测模块缓存里没有 onnxruntime-web，且把 onnxruntime-node 移走时它**不能顶替**（硬失败：
  #     "Cannot find module 'onnxruntime-node'"）。所以它是死重。
  #     ⚠️ 若将来把编码搬进**渲染层 / Worker**（那条路走的是 onnxruntime-web），**必须删掉这条排除**。
  - '!**/onnxruntime-web/**'
  #
  #   【前提 B】本产物只出 **win32-x64 与 win32-arm64**（2026-10-15 所有者决定支持 arm64）⇒
  #     排除 **darwin / linux** 的 ORT 二进制（153.5 MB）：darwin/arm64 85.3 · linux/x64 44.1 · linux/arm64 24.3。
  #     为什么只排这些：onnxruntime-node 的 bin/napi-v6/ 下共 287.1 MB，Windows 的两个架构才是本产物的目标
  #     （22c 实测 x64 加载到的是 <asar>\node_modules\onnxruntime-node\bin\napi-v6\win32\x64\onnxruntime_binding.node）。
  #     ✅ **win32/arm64 必须保留**：arm64 Windows 上解析到的是 .../win32/arm64/onnxruntime_binding.node；
  #        排掉它 ⇒ arm64 产物检索**直接起不来**（不是变慢）。
  #        （T-22d 第一版曾把它一起排掉 —— 那是"只出 x64"的旧前提下才成立，owner 改口径后已撤销。）
  #     ⚠️ **将来要出 macOS / Linux 产物时，撤销下面这两条**，否则那些平台的检索起不来。
  #     ⚠️ arm64 产物**本轮未验证**（本沙箱无网 + 无 arm64 机器）：命令是
  #        npx electron-builder --win --arm64    （**不把默认 target 改成 arm64**，避免每次打包都去下载 arm64 Electron）
  #        还有一件 arm64 专属的坑没解决：sharp 的 arm64 包（@img/sharp-win32-arm64）本机没装，
  #        见 reports/2026-10-15-wave3/22d.txt「arm64 还差什么」。
  - '!**/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!**/onnxruntime-node/bin/napi-v6/linux/**'
asarUnpack:
  - resources/**
win:
  executableName: gemma-search
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
linux:
  target:
    - AppImage
    - deb
  maintainer: gemma-search
  category: Utility
npmRebuild: false
